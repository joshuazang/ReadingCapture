name: Reading Capture macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install Skim scripting dictionary for compile checks
        run: brew install --cask skim
      - name: Native encryption and archive tests
        run: CAPTURE_EXPORT_FIXTURE="$RUNNER_TEMP/capture-export.txt" bash scripts/ci-command.sh swift test
      - name: Checkout pinned import compatibility fixture (tests only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: joshuazang/IM-style-editor
          ref: aaeaddd97a82b9361fcc76e4472fe9b207b70bcb
          path: .compat/IM-style-editor
          sparse-checkout: shared/core
          persist-credentials: false
      - name: Test actual export with both editors' shared importer
        run: node scripts/check-interchange.cjs "$RUNNER_TEMP/capture-export.txt"
      - name: Build standalone app
        run: bash scripts/ci-command.sh bash -x scripts/build-app.sh
      - name: Verify Mac ZIP and disk image
        run: bash scripts/ci-command.sh bash -x scripts/verify-package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReadingCapture-macOS
          path: |
            dist/ReadingCapture-macOS.zip
            dist/ReadingCapture-macOS.dmg
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ReadingCapture-macOS
          path: dist
      - name: Publish verified development downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download ReadingCapture-macOS.dmg, open it, and drag Reading Capture into Applications.

          Requires macOS 13 or newer. Apple Silicon only. These direct release assets avoid GitHub Actions' nested ZIP download.

          This update adds a Dock icon and reopen handler, automatic per-capture comment saving, and a floating optional comment panel after copying. New captures preserve the active library editor. Native highlight shortcuts are not connected yet.

          Native Keychain/encryption, incoming-capture/comment recovery, rendered-window reopening, and export compatibility tests passed. Both packages were verified on macOS: ZIP extraction, DMG mounting, code signatures, Apple Silicon-only architecture and executable byte comparisons. SHA256SUMS.txt provides download integrity checks.

          This is an ad-hoc signed development prototype, not Developer ID signed or notarized. macOS may request an explicit per-app approval. Real Skim/calibre interactions and UI flows still need device verification. Do not disable Gatekeeper globally.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/ReadingCapture-macOS.dmg dist/ReadingCapture-macOS.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME — Development build" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
